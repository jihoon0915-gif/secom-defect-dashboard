services:
  - type: web
    name: secom-defect-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir scripts server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SLACK_ALERT_COOLDOWN_SECONDS
        value: "60"
